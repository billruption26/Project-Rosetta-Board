[project]
name = "project-rosetta-board"
version = "0.1.0"
description = "Project Rosetta Board: Universal Storyboard Ingestor with Google ADK, Multimodal Gemini, and ClickHouse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.8.0",
    "google-genai>=2.0.0",
    "clickhouse-connect>=0.8.0",
    "streamlit>=1.40.0",
    "pydantic>=2.10.0",
    "pillow>=11.0.0",
    "pypdf>=5.0.0",
    "reportlab>=4.2.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "google-cloud-aiplatform[adk,agent-engines]>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
