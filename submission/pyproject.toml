[project]
name = "rosetta-board-dashboard"
version = "0.1.0"
description = "Project Rosetta Board: Crew Production Dashboard & Agent Runtime Interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "google-cloud-aiplatform>=1.70.0",
    "google-adk>=2.8.0",
    "pydantic>=2.10.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
